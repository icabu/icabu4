name: Publish to Modrinth

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег релиза, который нужно опубликовать на Modrinth"
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Определить тег релиза
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "RELEASE_TAG=${{ github.event.inputs.tag }}" >> "$GITHUB_ENV"
          else
            echo "RELEASE_TAG=${{ github.event.release.tag_name }}" >> "$GITHUB_ENV"
          fi

      - name: Получить данные релиза через API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/releases/tags/$RELEASE_TAG" > release.json
          NAME=$(jq -r '.name' release.json)
          echo "VERSION_NAME=$NAME" >> "$GITHUB_ENV"
          jq -r '.body' release.json > changelog.txt

      - name: Скачать .mrpack из релиза
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --pattern "*.mrpack" \
            --dir .
          MRPACK_FILE=$(ls *.mrpack | head -n1)
          echo "Найден файл: $MRPACK_FILE"
          echo "MRPACK_FILE=$MRPACK_FILE" >> "$GITHUB_ENV"

      - name: Определить версию Minecraft и загрузчик из mrpack
        run: |
          unzip -p "$MRPACK_FILE" modrinth.index.json > index.json
          MC_VERSION=$(jq -r '.dependencies.minecraft' index.json)
          LOADER=$(jq -r '.dependencies | keys[] | select(endswith("-loader"))' index.json | sed 's/-loader$//' | head -n1)
          echo "Minecraft: $MC_VERSION, Loader: $LOADER"
          echo "MC_VERSION=$MC_VERSION" >> "$GITHUB_ENV"
          echo "LOADER=$LOADER" >> "$GITHUB_ENV"

      - name: Сформировать JSON для Modrinth API
        env:
          MODRINTH_PROJECT_ID: "ea2V0WBF"
        run: |
          CHANGELOG=$(cat changelog.txt)
          jq -n \
            --arg name "$VERSION_NAME" \
            --arg version_number "$RELEASE_TAG" \
            --arg changelog "$CHANGELOG" \
            --arg project_id "$MODRINTH_PROJECT_ID" \
            --arg mc "$MC_VERSION" \
            --arg loader "$LOADER" \
            '{
              name: $name,
              version_number: $version_number,
              changelog: $changelog,
              dependencies: [],
              game_versions: [$mc],
              version_type: "release",
              loaders: [$loader],
              featured: false,
              status: "listed",
              requested_status: "listed",
              project_id: $project_id,
              file_parts: ["file"],
              primary_file: "file"
            }' > data.json

      - name: Опубликовать версию на Modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          HTTP_CODE=$(curl -sS -w "%{http_code}" -o response.json -X POST "https://api.modrinth.com/v2/version" \
            -H "Authorization: $MODRINTH_TOKEN" \
            -F "data=@data.json;type=application/json" \
            -F "file=@${MRPACK_FILE};type=application/x-modrinth-modpack+zip")

          echo "HTTP статус: $HTTP_CODE"
          echo "Ответ Modrinth:"
          cat response.json

          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "::error::Modrinth API вернул ошибку $HTTP_CODE"
            exit 1
          fi
